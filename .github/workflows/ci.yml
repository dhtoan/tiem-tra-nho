name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Syntax and production build
        run: npm run check
      - name: Start local Worker
        run: |
          npx wrangler dev --local --port 8787 > /tmp/ttn-wrangler.log 2>&1 &
          echo $! > /tmp/ttn-wrangler.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ttn-wrangler.log
          exit 1
      - name: Smoke test D1 auth and cloud save
        run: npm run test:smoke
      - name: Wrangler log on failure
        if: failure()
        run: cat /tmp/ttn-wrangler.log || true
