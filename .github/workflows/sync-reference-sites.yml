name: Sync reference game sites

on:
  push:
    branches: [main]
    paths:
      - scripts/sync-reference-sites.mjs
      - .github/workflows/sync-reference-sites.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser crawler
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture both game sites
        run: node scripts/sync-reference-sites.mjs
      - name: Commit captured assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference
          if git diff --cached --quiet; then
            echo "No reference changes"
            exit 0
          fi
          git commit -m "sync: capture Tiệm Trà reference sites [skip ci]"
          git push
