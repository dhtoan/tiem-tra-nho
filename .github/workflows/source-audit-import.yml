name: One-shot source audit and asset import

on:
  push:
    paths:
      - '.sync-source-assets-trigger'

permissions:
  contents: write

jobs:
  audit-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download source runtime for audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ttm-source
          curl -fL --retry 3 'https://tiemtramouoc.tensorship.tech/js/game.js?v=12.47.144' -o /tmp/ttm-source/game.js
          curl -fL --retry 3 'https://tiemtramouoc.tensorship.tech/css/style.css?v=12.47.144' -o /tmp/ttm-source/style.css
          curl -fL --retry 3 'https://tiemtramouoc.tensorship.tech/js/banbe.js?v=12.47.144' -o /tmp/ttm-source/banbe.js
          curl -fL --retry 3 'https://tiemtramouoc.tensorship.tech/css/banbe.css?v=12.47.144' -o /tmp/ttm-source/banbe.css
          curl -fL --retry 3 'https://tiemtramouoc.tensorship.tech/js/baucua.js?v=12.47.144' -o /tmp/ttm-source/baucua.js
          curl -fL --retry 3 'https://tiemtramouoc.tensorship.tech/js/xidach.js?v=12.47.144' -o /tmp/ttm-source/xidach.js

      - name: Print source-only feature audit
        shell: bash
        run: |
          set -euo pipefail
          echo '=== FRONT SHOP / SHIPPER MAP / KARIN FEATURE MATCHES ==='
          grep -nEi 'frontshop|shippermap|karin|frontCall|frontBtn|frontPedestrian|shippersWrap|centerSignboard' /tmp/ttm-source/game.js /tmp/ttm-source/style.css | head -n 500 || true
          echo '=== REFERENCED IMAGE ASSETS ==='
          grep -Eho "img/[A-Za-z0-9_.-]+\.(png|jpg|jpeg|webp)" /tmp/ttm-source/* | sort -u || true

      - name: Download missing public image assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/img
          curl -fL --retry 3 'https://tiemtramouoc.tensorship.tech/img/imbg.png' -o assets/img/imbg.png
          curl -fL --retry 3 'https://tiemtramouoc.tensorship.tech/img/9517-thanmeo_karin.png' -o assets/img/9517-thanmeo_karin.png
          curl -fL --retry 3 'https://tiemtramouoc.tensorship.tech/img/map.jpg' -o assets/img/map.jpg
          file assets/img/imbg.png assets/img/9517-thanmeo_karin.png assets/img/map.jpg
          test -s assets/img/imbg.png
          test -s assets/img/9517-thanmeo_karin.png
          test -s assets/img/map.jpg

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/img/imbg.png assets/img/9517-thanmeo_karin.png assets/img/map.jpg
          if git diff --cached --quiet; then
            echo 'No asset changes'
            exit 0
          fi
          git commit -m 'assets: import missing front shop and shipper map artwork'
          git push origin HEAD:main
