name: Import Tiệm Trà Mơ Ước assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-tiemtramouoc-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download runtime images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p img
          base="https://tiemtramouoc.tensorship.tech/img"
          files=(
            bau.png ca.png cua.png ga.png tom.png nai.png xocdia.png
            cup.png bg2.jpg bg.jpg cathead.png faces.webp
            ic_angry.png ic_book.png ic_box.png ic_calendar.png ic_chart.png ic_chartdown.png ic_chartup.png
            ic_clock.png ic_cupempty.png ic_cupfull.png ic_gift.png ic_hourglass.png ic_lock.png ic_money.png
            ic_moon.png ic_pause.png ic_pearlbowl.png ic_pen.png ic_people.png ic_phone.png ic_price.png
            ic_receipt.png ic_reload.png ic_sad.png ic_set.png ic_star.png ic_strawberry.png ic_teapot.png
            ic_tools.png ic_trash.png ic_trophy.png ic_upbulb.png ic_upchair.png ic_upcups.png ic_upmega.png
            ic_upsnow.png ic_warn.png
            kho.jpg lanL.png lanR.png lid.png qrzl.jpg ship.webp splash2.jpg star.webp
            stk_berry.png stk_cloud.png stk_cup.png stk_heart.png stk_leaf.png stk_pearl.png stk_star.png
            icon-180.png icon-192.png
          )
          for f in "${files[@]}"; do
            echo "Downloading $f"
            curl --fail --location --silent --show-error --retry 3 --retry-delay 1 "$base/$f" -o "img/$f"
            test -s "img/$f"
          done
          printf '%s\n' "${files[@]}" | sort > img/IMPORTED_FILES.txt
      - name: Commit exact image assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img
          if git diff --cached --quiet; then
            echo "No image changes"
            exit 0
          fi
          git commit -m "assets: import Tiệm Trà Mơ Ước runtime images [skip ci]"
          git push
