name = "tiem-tra-nho"
main = "src/worker.js"
compatibility_date = "2026-09-28"
workers_dev = true
preview_urls = true

[observability]
enabled = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[vars]
ALLOWED_HOSTS = "tiemtranho.aunomay.com,tiem-tra-nho.aunomay.workers.dev"
PUBLIC_ORIGIN = "https://tiemtranho.aunomay.com"

[[d1_databases]]
binding = "DB"
database_name = "tiem-tra-nho"
database_id = "edd952aa-872d-4f34-aa67-8e3dd83bc79d"
migrations_dir = "migrations"
