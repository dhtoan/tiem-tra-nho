.q3bub.q3idleB .q3pat,.q3bub.q3idleB #q3want{display:none}.q3bub.q3idleB #q3say{grid-column:1/-1;grid-row:1/-1;font-size:26px!important}
.q3pat{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;letter-spacing:.03em}
.q3bar{flex:1;height:20px;border-radius:10px;border:3px solid #4a3120;background:#fffaf0;overflow:hidden;box-sizing:border-box}
.q3bar i{display:block;height:100%;width:100%;background:#8fcf8f;border-radius:6px;transition:width .5s linear}
.q3tag{position:absolute;display:grid;place-items:center;font-weight:800;font-size:19px;letter-spacing:.02em;white-space:nowrap;color:#4a3120;line-height:1}
.q3jarT{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:16px;line-height:1.02;text-align:center;pointer-events:none}
.q3lbT{position:absolute;display:grid;place-items:center;font-weight:800;font-size:16px;line-height:1.02;text-align:center;pointer-events:none}
.q3z{position:absolute;border-radius:14px;transition:background .1s}
.q3z:active,.q3z.q3on{background:rgba(255,255,255,.28)!important}
.q3z.q3want{z-index:1;box-shadow:0 0 0 3px #fff,0 0 0 7px #ff6a00,0 0 16px 8px rgba(255,106,0,.55);animation:q3wantP 1.4s ease-in-out infinite}
@keyframes q3wantP{50%{box-shadow:0 0 0 3px #fff,0 0 0 8px #ff6a00,0 0 22px 12px rgba(255,106,0,.35)}}
@media (prefers-reduced-motion:reduce){.q3z.q3want{animation:none}}
.q3z.q3empty::after,.q3z.q3lock::after{content:"Hết";position:absolute;inset:6px;border-radius:10px;background:rgba(255,250,240,.75);display:grid;place-items:center;font-weight:800;font-size:22px;color:#8a6f58}
.q3z.q3lock::after{content:"🔒";font-size:26px;background:rgba(240,230,215,.85)}
.q3z.q3pick{box-shadow:0 0 0 4px #5aae86}
.q3z.q3coachT{z-index:2;box-shadow:0 0 0 4px #4a90c8;animation:none}
.q3z.q3coachT::before{content:'';position:absolute;inset:-10px;border:5px solid #4a90c8;border-radius:18px;animation:q3ring 1.1s ease-out infinite;will-change:transform,opacity;pointer-events:none}
@keyframes q3ring{from{transform:scale(.96);opacity:1}to{transform:scale(1.08);opacity:0}}
@keyframes q3pulse{0%,100%{box-shadow:0 0 0 4px #4a90c8,0 0 0 8px rgba(74,144,200,.25)}50%{box-shadow:0 0 0 6px #4a90c8,0 0 0 16px rgba(74,144,200,.12)}}
#q3coach{position:absolute;left:210px;top:296px;width:420px;min-height:40px;box-sizing:border-box;background:#4a90c8;color:#fff;border-radius:14px;padding:6px 12px;font-weight:800;font-size:19px;line-height:1.15;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 4px 0 #2f6c9c;pointer-events:none;z-index:4}
.q3jar{touch-action:none}
.q3badge{position:absolute;min-width:28px;height:28px;border-radius:14px;background:#f3d6b0;border:2.5px solid #5a4030;display:grid;place-items:center;font-weight:800;font-size:16px;line-height:1;padding:0 4px;box-sizing:border-box;pointer-events:none;font-variant-numeric:tabular-nums}
.q3badge.q3sm{min-width:24px;height:24px;font-size:13px;border-width:2px}
.q3g{position:absolute;left:0;top:0;width:100%;height:100%}
.q3g>svg,.q3g>img{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none;max-width:none}
.q3g>img.q3lid{left:-.5%;top:-20.4%;height:48.6%}
#q3cup{position:absolute;will-change:transform}
.q3patch{position:absolute;background:#faefd4;pointer-events:none}/* che vệt kệ dư; nằm dưới lớp phủ màu chung của quầy */
.q3tem{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);z-index:4;pointer-events:none}
#q3noCup{position:absolute;left:40px;top:760px;width:186px;text-align:center;font-weight:800;font-size:22px;color:#7a5530;line-height:1.15;pointer-events:none}
.q3spr{position:absolute;background-image:url(img/bg.jpg);background-repeat:no-repeat;background-size:768px 1376px;pointer-events:none}
.q3pop{position:absolute;background-image:url(img/bg.jpg);background-repeat:no-repeat;background-size:768px 1376px;transform-origin:50% 100%;pointer-events:none}
.q3pop.wob{animation:q3wob .28s ease-in-out infinite alternate}
.q3gauge{position:absolute;left:48px;top:878px;width:170px;height:18px;border-radius:9px;background:#5b3f25;padding:3px;box-sizing:border-box}
.q3lv{height:100%;border-radius:6px;background:linear-gradient(90deg,#e2574c,#f4b73a 60%,#5aae86 80%);width:0}
.q3ok{position:absolute;top:-4px;bottom:-4px;left:74%;width:12%;border:3px solid #fff;border-radius:5px}
#q3hint{position:absolute;left:4px;top:916px;width:262px;text-align:center;font-weight:800;font-size:18px;white-space:nowrap;color:#5b3f25;line-height:1}
.q3fly{position:fixed;left:0;top:0;pointer-events:none;z-index:25}
.q3flyT{position:fixed;pointer-events:none;z-index:25;font-weight:800;font-size:13px;color:#fff;background:rgba(59,42,32,.85);border-radius:8px;padding:0 6px;white-space:nowrap;font-family:"Baloo 2",system-ui,sans-serif}
@keyframes q3bob{50%{transform:translateY(-3px)}}
@keyframes q3wob{from{transform:scale(1.02,1.02)}to{transform:scale(1.06,1.04)}}
@keyframes q3shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
</style>
