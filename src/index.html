<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="only light">
  <title>🧋 Tiệm Trà Nhỏ</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167x167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120x120.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#F7628E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tiệm Trà Nhỏ">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Google Fonts: Baloo 2 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Anti-cache Meta Tags for HTML -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Tự động phát hiện phiên bản mới và làm mới cache ngay lập tức -->
  <script>
    (function(){
      if(window.location.search){
        try{
          var u = new URL(window.location.href);
          u.searchParams.delete('v');
          u.searchParams.delete('_t');
          window.history.replaceState({}, document.title, u.pathname + (u.search||'') + u.hash);
        }catch(e){}
      }
      if(location.protocol.startsWith('http')){
        fetch('version.json?_t=' + Date.now(), { cache: 'no-store' })
          .then(function(r){ return r.json(); })
          .then(function(d){
            var myVer = '1.0.0';
            if(d && d.version && d.version !== myVer){
              console.log('🔄 Đang đồng bộ phiên bản mới:', d.version);
              if('caches' in window){
                caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); });
              }
              if('serviceWorker' in navigator){
                navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); });
              }
              try{
                var u2 = new URL(window.location.href);
                u2.searchParams.delete('v');
                u2.searchParams.delete('_t');
                window.history.replaceState({}, document.title, u2.pathname + (u2.search||'') + u2.hash);
              }catch(e){}
              window.location.reload(true);
            }
          })
          .catch(function(){});
      }
    })();
  </script>

  <!-- Stylesheet (Cache Busting) -->
  <link rel="stylesheet" href="/assets/css/style.css?v=1.0.0">
  <link rel="stylesheet" href="/assets/css/baucua.css?v=1.0.0">
  <link rel="stylesheet" href="/assets/css/xidach.css?v=1.0.0">
  <link rel="stylesheet" href="/assets/css/banbe.css?v=1.0.0">
</head>
<body>
  <div class="app">
    <header>
      <div class="h-l">
        <button id="bcBtn" class="pbtn pearl-btn" aria-label="Bầu Cua" title="Gieo Trân Châu May Mắn"><img class="ico" src="/assets/img/stk_pearl.png" alt="Trân Châu"></button>
        <button id="xdBtn" class="pbtn xidach-btn" aria-label="Xì Dách" title="Thử Tài Xì Dách Trân Châu">🧋</button>
        <button id="frBtn" class="pbtn friend-btn" aria-label="Bạn Bè" title="Bạn Bè & Quà Tặng">👥</button>
        <div class="h-day">Ngày <span id="hDay">1</span><small id="hSub">Chuẩn bị</small></div>
      </div>
      <div class="h-m"><small id="hName">Tiệm Trà Nhỏ</small><span id="hMoney">0đ</span></div>
      <div class="h-r">
        <button id="hRatebox" class="h-ratebox" type="button" aria-label="Mở tab Đánh giá" title="Xem đánh giá"><span class="stars" id="hStars">★★★★☆</span><small id="hRate">4,0</small></button>
        <button id="pauseBtn" class="pbtn" aria-label="Tạm dừng"><img class="ico" src="/assets/img/ic_pause.png" alt=""></button>
        <button id="setBtn" class="pbtn gear" aria-label="Cài đặt"><img class="ico" src="/assets/img/ic_set.png" alt=""></button>
      </div>
    </header>
    <div class="awning"></div>
    <main id="view"></main>
  </div>

  <div class="toast" id="toast"></div>
  <div class="modal" id="modal" hidden><div class="card" id="card"></div></div>
  <div class="splash" id="splash" hidden></div>

  <!-- Bầu Cua Minigame Modal -->
  <div class="baucua-modal" id="baucua-modal" hidden><div class="baucua-card" id="baucua-card"></div></div>

  <!-- Xì Dách Trân Châu Minigame Modal -->
  <div class="xidach-modal" id="xidach-modal" hidden><div class="xidach-card" id="xidach-card"></div></div>

  <!-- Game Engine Script (Cache Busting) -->
  <script src="/assets/js/banbe.js?v=1.0.0"></script>
  <script src="/assets/js/game.js?v=1.0.0"></script>
  <script src="/assets/js/baucua.js?v=1.0.0"></script>
  <script src="/assets/js/xidach.js?v=1.0.0"></script>

</body>
