name = "tiem-tra-nho"
main = "src/worker.js"
compatibility_date = "2026-09-28"
workers_dev = true
preview_urls = true

[observability]
enabled = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "tiem-tra-nho"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
ALLOWED_HOSTS = "tiemtranho.aunomay.com"
